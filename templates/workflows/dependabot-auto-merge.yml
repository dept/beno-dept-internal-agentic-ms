# Merges Dependabot's patch-level pull requests once every check on them is green.
#
# Not installed by the standard's installer. Copy it into a repository only after the
# team agrees that a patch bump may reach the base branch without a human reading it,
# and check what merging that branch triggers first: on a repository where a merge to
# the default branch starts a production release, point Dependabot at an integration
# branch (`target-branch` in .github/dependabot.yml) before enabling this.
#
# Why it watches the checks itself instead of `gh pr merge --auto`:
# `--auto` needs "Allow auto-merge" enabled on the repository, and it merges as soon as
# the branch rules are satisfied. A ruleset with no *required status checks* is satisfied
# the moment the pull request exists, so `--auto` would merge before CI had run at all.
# Watching the checks here holds the same guarantee without depending on repository
# settings or on someone having marked the right check as required.
name: Dependabot patch auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Never checks out the pull request branch, so the untrusted head commit is never
# executed. Everything below reads metadata and talks to the API.
permissions:
  contents: write
  pull-requests: write

# A force-push from Dependabot restarts the watch instead of leaving two running.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Long enough for a slow pipeline, short enough that a hung check does not hold a
    # runner all day. A timeout here leaves the pull request open for a human.
    timeout-minutes: 60
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # A grouped pull request reports the highest update type it contains, which is why
      # .github/dependabot.yml keeps patch in a group of its own. A `minor` group, or any
      # major, falls through to a human.
      - name: Wait for every check to pass
        id: checks
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # Non-zero covers all three cases that must not merge: a check failed, the watch
        # timed out with checks still pending, and no checks reported at all (a repository
        # with no pull request pipeline must not silently gain unattended merges).
        run: gh pr checks "$PR_URL" --watch --fail-fast --interval 60

      - name: Merge
        if: steps.checks.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash
