# Merges Dependabot's patch-level pull requests once every check on them is green.
#
# Installed dormant. The per-repository switch is the Actions variable DEPENDABOT_AUTO_MERGE
# (Settings > Secrets and variables > Actions > Variables): unset or anything other than `true`
# skips the job and merges nothing. Set it to `true` to turn patch auto-merge on, delete it to
# turn it off, no code change and no new pull request either way.
#
# Not the native "Allow auto-merge" setting: that one is shared with developers enabling
# auto-merge on their own pull requests, so it is already on in most repositories and cannot
# double as a Dependabot-only switch.
#
# Only turn it on where the branch Dependabot targets is merged into the default branch as a
# whole (a develop -> main promotion). On a repository that releases selectively (release
# branches, cherry-picks), a patch auto-merged into a work branch never reaches production;
# point Dependabot at the default branch there and leave this off.
#
# Why it watches the checks itself instead of `gh pr merge --auto`:
# `--auto` merges as soon as the branch rules are satisfied, and a ruleset with no
# *required status checks* is satisfied the moment the pull request exists, so `--auto`
# would merge before CI had run at all. Watching the checks here holds "green first" without
# depending on someone having marked the right check as required.
name: Dependabot patch auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && vars.DEPENDABOT_AUTO_MERGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Wait for every check to pass
        id: checks
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr checks "$PR_URL" --watch --fail-fast --interval 60

      - name: Merge
        if: steps.checks.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash
