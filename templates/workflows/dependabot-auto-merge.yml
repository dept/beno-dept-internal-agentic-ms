# Merges Dependabot's patch-level pull requests once every check on them is green.
#
# Installed dormant. The per-repository switch is the Actions variable DEPENDABOT_AUTO_MERGE
# (Settings > Secrets and variables > Actions > Variables): unset or anything other than `true`
# skips the job and merges nothing. Set it to `true` to turn patch auto-merge on, delete it to
# turn it off, no code change and no new pull request either way.
#
# Not the native "Allow auto-merge" setting: that one is shared with developers enabling
# auto-merge on their own pull requests, so it is already on in most repositories and cannot
# double as a Dependabot-only switch.
#
# Only turn it on where the branch Dependabot targets is merged into the default branch as a
# whole (a develop -> main promotion). On a repository that releases selectively (release
# branches, cherry-picks), a patch auto-merged into a work branch never reaches production;
# point Dependabot at the default branch there and leave this off.
#
# Why it watches the checks itself instead of `gh pr merge --auto`:
# `--auto` merges as soon as the branch rules are satisfied, and a ruleset with no
# *required status checks* is satisfied the moment the pull request exists, so `--auto`
# would merge before CI had run at all. Watching the checks here holds "green first" without
# depending on someone having marked the right check as required.
#
# Where CI runs outside GitHub Actions (Azure Pipelines, Jenkins), its check can register
# minutes after the pull request opens, after a faster check has already gone green. Set the
# Actions variable DEPENDABOT_REQUIRED_CHECKS to the check names, one per line (as the pull
# request's Checks list shows them; a line, not a comma, because names can contain commas), and
# the wait holds until each of them has passed: missing, pending or skipped does not count.
name: Dependabot patch auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && vars.DEPENDABOT_AUTO_MERGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Wait for every check to pass
        id: checks
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SELF: ${{ github.job }}
          REQUIRED: ${{ vars.DEPENDABOT_REQUIRED_CHECKS }}
        # Not `gh pr checks --watch`: that also waits on this job's own check, which cannot finish
        # while it watches, so every run sat until the timeout and merged nothing. Earlier runs of
        # this job cancelled by the concurrency group would also count as failures. Both carry
        # this job's name, so the loop drops it and judges the other checks only.
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 55 * 60))
          green=0
          while [[ $SECONDS -lt $deadline ]]; do
            # gh exits non-zero while checks are pending or failed; the JSON is still printed.
            json=$(gh pr checks "$PR_URL" --json name,bucket 2> "$RUNNER_TEMP/gh-err.txt" || true)
            if [[ -z $json && -s "$RUNNER_TEMP/gh-err.txt" ]]; then
              cat "$RUNNER_TEMP/gh-err.txt"
            fi
            others=$(jq -c --arg self "$SELF" '[.[]? | select(.name != $self)]' <<< "${json:-[]}")
            total=$(jq 'length' <<< "$others")
            failed=$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<< "$others")
            pending=$(jq '[.[] | select(.bucket == "pending")] | length' <<< "$others")
            # Names from DEPENDABOT_REQUIRED_CHECKS that have not passed yet (missing, pending, skipped).
            missing=$(jq -r --arg req "${REQUIRED:-}" '. as $all | $req | split("\n")
              | map(gsub("^\\s+|\\s+$"; ""))
              | map(select(length > 0 and (. as $n | any($all[]; .name == $n and .bucket == "pass") | not)))
              | join(", ")' <<< "$others")
            echo "checks: $total total, $pending pending, $failed failed, missing: ${missing:-none}"
            if [[ $failed -gt 0 ]]; then
              jq -r '.[] | select(.bucket == "fail" or .bucket == "cancel") | "failed: \(.name)"' <<< "$others"
              exit 1
            fi
            # Green twice, a minute apart: a fast check can finish before a slower workflow has
            # registered its own, and one green poll would merge before that CI ever ran.
            if [[ $total -gt 0 && $pending -eq 0 && -z $missing ]]; then
              green=$((green + 1))
              if [[ $green -ge 2 ]]; then
                exit 0
              fi
            else
              green=0
            fi
            sleep 60
          done
          echo "checks not green after 55 minutes (last poll: $total checks, $pending pending, required not passed: ${missing:-none})"
          exit 1

      - name: Merge
        if: steps.checks.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash
