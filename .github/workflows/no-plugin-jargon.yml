name: No plugin jargon in shipped content

on:
  pull_request:

jobs:
  no-plugin-jargon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject ponytail/caveman markers in added lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Local Claude Code plugins (ponytail, caveman) prefix comments with their own name.
          # Everything in this repository outside .github/ is vendored into client repositories,
          # where "ponytail:" means nothing to the reader a year later (BENO-Optiver-Website #743).
          # Only added lines are checked, so existing content is cleaned up by ordinary PRs, and
          # the changelog is exempt because it may describe removing the word.
          hits=$(git diff -U0 "$BASE_SHA" "$HEAD_SHA" -- . ':!.github/' ':!config/standard-version.yml' \
            | grep -E '^\+[^+]' | grep -iE 'ponytail|caveman' || true)

          if [[ -n "$hits" ]]; then
            echo "::error::Added lines carry plugin jargon (ponytail/caveman). Keep what the comment says, drop the prefix."
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "No plugin jargon added."
