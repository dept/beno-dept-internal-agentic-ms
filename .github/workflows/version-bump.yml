name: Standard version bump

on:
  pull_request:

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a version bump when standard content changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          VERSION_FILE="config/standard-version.yml"

          # Standard content is everything the standard installs into a target repository.
          # Repo-only files (docs, examples, CI, the readme and wiring files) do not need a bump,
          # and neither does a change limited to the version file itself.
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          standard_changed=$(printf '%s\n' "$changed" \
            | grep -Ev '^(docs/|examples/|\.github/|README\.md|AGENTS\.md|CLAUDE\.md|\.gitignore$)' \
            | grep -v "^${VERSION_FILE}$" || true)

          if [ -z "$standard_changed" ]; then
            echo "No standard content changed, version bump not required."
            exit 0
          fi

          echo "Standard content changed:"
          # Quoted and piped: an unquoted expansion would word-split and glob the path list.
          printf '%s\n' "$standard_changed" | sed 's/^/  /'

          # The top-level `version:` field is the version this PR's changes ship under.
          new_version=$(grep -E '^[[:space:]]+version:' "$VERSION_FILE" | head -1 \
            | sed 's/.*version:[[:space:]]*//; s/"//g' | tr -d '[:space:]')
          base_version=$(git show "$BASE_SHA:$VERSION_FILE" | grep -E '^[[:space:]]+version:' | head -1 \
            | sed 's/.*version:[[:space:]]*//; s/"//g' | tr -d '[:space:]')

          # The base branch's version is the current unreleased line, not a shipped release
          # (this repo tags no releases; production tracks whatever was last deployed). So a PR
          # may either stack its changelog entry onto the current version (new == base) or open
          # the next one (new > base); the changelog entry is what has to grow either way. The
          # only failure is a version that sorts BELOW the base branch's, which means the branch
          # was cut before a later bump landed on the base (#20, #21 both did this) - rebase.
          highest=$(printf '%s\n%s\n' "$base_version" "$new_version" | sort -V | tail -1)
          if [ "$highest" != "$new_version" ]; then
            echo "::error::${VERSION_FILE} has 'standard.version' ${new_version}, which sorts below the base branch's current ${base_version}. This branch was likely cut before a later bump landed on the base branch - rebase, then stack onto or bump above ${base_version}."
            exit 1
          fi

          if [ "$new_version" = "$base_version" ]; then
            echo "Stacking onto the current unreleased version ${new_version}."
          else
            echo "Version bumped from ${base_version} to ${new_version}."
          fi
          exit 0
