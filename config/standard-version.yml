# DEPT Agentic Project Standard — Version Tracker
# This file is the single source of truth for the current standard version.
# Bump this when templates, required files, or agent definitions change.

standard:
  version: "2.7.5"
  release_date: "2026-09-11"
  changelog:
    - version: "2.7.5"
      date: "2026-09-11"
      changes:
        - "`scripts/graphify-bootstrap.sh`'s no-key fallback actually forces code-only mode now. It detected the no-LLM-key case and rewrote `.graphifyignore` to exclude docs, papers and images, but Graphify's own preflight counts those files before ignore patterns are applied and aborted anyway with \"no LLM API key found (... file(s) need semantic extraction)\", leaving `graphify-out/` empty and Discovery silently falling back to raw-repository scanning with no warning that the accelerator never ran. Found on a real migration (dtnl-bpd-platform: 1950 doc and image files, all correctly listed in `.graphifyignore`, still triggered the abort). `enable_no_llm_code_only_mode` now appends `--code-only` to the graphify invocation, the CLI's own documented escape hatch, instead of relying on `.graphifyignore` alone to suppress the scan. Verified against a scratch repository (graph.json produced, zero docs and images) and against dtnl-bpd-platform (21098 nodes, 47131 edges from a code-only run that previously produced nothing)"
        - "Released as 2.5.1 on the branch this lands from, cut when main was still on 2.5.0. Main had already shipped 2.6.0 through 2.7.4, so the number is corrected here rather than reused: a migration stamped 2.5.1 reports a version that never existed upstream and sorts below every release it is actually missing"
    - version: "2.7.4"
      date: "2026-09-11"
      changes:
        - "Every conditional test in `scripts/validate.sh` uses `[[ ]]` instead of `[ ]`. The script is vendored into every migrated repository, so a client pipeline that runs SonarQube scans it as first-party source and raises its shell rule on each single-bracket test: the Fastned pull request alone reported three, and a larger version jump reports more. `scripts/install.sh` and `scripts/mirror-claude.sh` already used `[[ ]]`, so this makes the shipped scripts consistent. Output is byte-identical, verified against five migrated repositories, and every comparison already quoted both sides so no pattern-matching behaviour changes"
        - "`scripts/scaffold.sh` and `scripts/version-report.sh` converted with it. Neither is vendored, so no client scanner sees them, but leaving them on the old form is what reintroduces the rule the next time a check moves between scripts"
    - version: "2.7.3"
      date: "2026-09-10"
      changes:
        - "scripts/gen-dependabot.sh groups the github-actions ecosystem into one pull request (`groups.actions.patterns: [\"*\"]`). The ecosystem previously got no grouping at all, so the first run on a real client repository opened three separate pull requests for three action bumps, two of them majors, each firing a full CI pipeline. Majors stay allowed for actions on purpose: an action pinned to a major that no longer receives fixes is the actual risk, and the blast radius of a bad action version is CI, not the product"
        - "The generated open-pull-requests-limit drops from five to three per ecosystem, and applies to github-actions too, which had no limit. On a repository whose pipeline runs ten minutes per branch, five concurrent update branches is most of a build agent's morning"
        - "`rebase-strategy: disabled` on every ecosystem. Dependabot rebases each open pull request whenever the base branch moves, and every rebase re-runs the whole pipeline: a busy default branch multiplies one weekly update batch into a build per merge per open pull request. A stale branch is rebased on demand from the pull request instead"
        - "Package ecosystems are scheduled on Monday and github-actions on Tuesday, so a repository with both does not open every update branch in the same minute"
    - version: "2.7.2"
      date: "2026-09-10"
      changes:
        - "Fix: scripts/validate.sh Reference Integrity no longer scans files git ignores. An editor's .history/ or a planning tool's .hermes/ holds stale copies of this standard's own prose, and every path they name resolved against a layout from months ago: the standards repository's self-check reported 82 broken references, all of them noise, which is enough to make the section useless as a gate. An ignored file is local scratch, not standard content"
        - "Fix: a path git is told to ignore is absent on purpose and is no longer reported as a broken reference. A repository that documents a local-only file (.claude/settings.local.json, excluded through .git/info/exclude) is describing its layout correctly. check-ignore honours .gitignore and .git/info/exclude, which is where such files are listed"
        - "Fix: the Maintainer Workflow Guard check accepts a guard that names one default branch. It demanded the template's `main || master` line verbatim, so a repository whose default branch is main and whose guard names only main failed a workflow that was already correct. Any `github.ref == refs/heads/main` or `refs/heads/master` comparison on the job closes the hole the guard exists for"
    - version: "2.7.1"
      date: "2026-09-10"
      changes:
        - "New: docs/confluence-layout.md, vendored into every target repository and fetched by prompts/01-install.prompt.md. The page standard said which sections a handover page carries but never how a section is rendered, so each migration chose per project: one Onboarding page shipped flat bullet lists, another a heading per topic, another tables. The layout file owns block choice (three or more parallel facts is a table, a command is a code block, a dependent sequence is a numbered list), heading depth (bodies start at H2, since Confluence already renders the page title), the column set for each of the twelve recurring tables, which three panel macros are allowed, the prose and bullet budget, and an anti-pattern table. The split with docs/confluence-page-standard.md is strict: structure there, rendering here, neither restating the other"
        - "Fix: the Onboarding page's `## Local development workflow` is a Task/Command/Notes table whose minimum rows are Install, Run, Test, Build and Commit, with the commit and branch convention stated under it. The section previously had no required row set, so pages listed install/run/test/build and dropped the commit convention that sat next to it in the .ai/onboarding.md cheatsheet, leaving a new engineer with a first commit the git hooks reject. Stated in the page standard, the Phase 3 prompt, its verification checklist, and both agents"
        - "Fix: the repository's own prose is named as the primary Confluence wording source: root and per-package README.md, CONTRIBUTING.md, and doc/ or docs/ when present. Only doc/ or docs/ was named before, so a readme documenting the commit format, the required wrapper command or the local setup order was not read while the Onboarding page was written. Applied in the page standard, prompts/03-integrate.prompt.md and the Discovery Agent"
        - "The Maintainer applies the layout file on every Confluence sync and brings an older-shaped section to the standard shape while it is already updating it, so pages written before this version converge instead of staying frozen"
    - version: "2.7.0"
      date: "2026-09-09"
      changes:
        - "New: scripts/gen-dependabot.sh, installed into target repositories and run by scripts/install.sh on install and on every --update refresh. It writes .github/dependabot.yml when a project has none, so dependency updates are part of the standard instead of a per-project decision"
        - "Detection is lockfile-driven, not manifest-driven: it reads tracked package-lock.json, yarn.lock, pnpm-lock.yaml, composer.lock, Gemfile.lock, *.sln or *.csproj, Dockerfile and .github/workflows, and derives one directory entry per lockfile location. A package.json without a lockfile is not a real update target, and a monorepo has a manifest per component, which manifest detection would turn into dozens of noise directories. Only git-tracked files count, so .gitignore and vendored trees are honoured"
        - "Install-if-absent: an existing .github/dependabot.yml is never overwritten, because projects hand-tune theirs with private registries, commit prefixes and custom groups. A target that is not a git work tree, or has no tracked lockfiles or workflows, is reported and skipped rather than failing the install"
        - "The generated config is deliberately quiet: weekly interval, five open pull requests per ecosystem, major version updates ignored, and minor and patch grouped into one pull request. Security updates are an org-wide GitHub setting and are enabled separately, which the generated file states in a header comment"
    - version: "2.6.0"
      date: "2026-08-26"
      changes:
        - "templates/workflows/maintainer.yml guards the maintain job to the default branch: `if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'` at job level. The workflow triggers on schedule and workflow_dispatch only; schedule always fires with github.ref = the default branch, so the guard passes and the biweekly run is unaffected. The one leak was a manual workflow_dispatch against a non-default branch, which would check out that branch, commit .ai/ updates and open a PR from the wrong base: the guard skips the whole job on any ref other than main/master. Future migrations ship the guarded workflow; already-migrated repos are handled separately"
        - "scripts/validate.sh gains a Maintainer Workflow Guard check. When .github/workflows/maintainer.yml is present it asserts the default-branch job guard is there and fails if missing; conditional on the file existing, since the workflow is bootstrap-only and not in every repo. Cheap and specific: one grep for the compound if-condition, no YAML parser"
    - version: "2.5.0"
      date: "2026-08-26"
      changes:
        - "scripts/install.sh vendors config/change-impact-matrix.yml and docs/confluence-page-standard.md into every target repo as durable artifacts, and prompts/01-install.prompt.md fetches both. The durable Maintainer Agent reads them on every run (change classification, and the Confluence page schema plus sync map), so a migrated repo shipped a dead reference to each: the file was named by the installed agent but never installed. A Copilot reviewer caught it on real client migration PRs. Both are durable, so a project already migrated picks them up on the next `bash scripts/install.sh . --update`"
        - "agents/maintainer.agent.md no longer tells a migrated repo the CI workflow lives at templates/workflows/maintainer.yml, an authoring-layout path a target repo never has. It names the raw upstream URL to fetch instead, the same one the migrate prompt's Phase 4b already uses, so the setup instruction resolves from inside a client"
        - "prompts/03-integrate.prompt.md now emits the .ai/.meta.yml confluence: block as a map keyed landing/overview/architecture/environments/onboarding, each { title, id }, matching the field path confluence.pages.landing.id that the confluence-axi skill and the Maintainer read. Some early migrations wrote a pages: list with a separate landing_title:, which has no landing.id to resolve, so Confluence sync silently matched nothing and risked duplicate pages"
        - "scripts/validate.sh gains two client-mode checks. Reference Integrity now also resolves the standards-owned paths (config/ docs/ scripts/ standards/) named by the durable Maintainer Agent and standards/writing-rules.md, the one part of .github/agents/ a target repo can safely check. The bootstrap-only Discovery Agent stays out of scope because it legitimately names standards-repo-only paths (scripts/install.sh, standards/agentic-project-standard.md, config/stack-detection.yml fetched at migration time). New Confluence Metadata Schema check warns, without failing CI, when a .ai/.meta.yml confluence: block is not the map form the skill reads"
    - version: "2.4.0"
      date: "2026-08-24"
      changes:
        - "standards/writing-rules.md §2 is now the single-source rule and says what a restatement is. A .ai/ file is a chapter, not a self-contained briefing: the instruction to make each file complete for its own audience is what produced, in one migrated repository, the same eight build steps under two headings, one container image described across six files, one toolchain version floor in seven, and three already-drifted copies of one command list. Only three shapes exist and the section says which is allowed where: a pointer (no facts, allowed everywhere), a constraint line (one fact with the owning .ai/ file named inline, allowed in AGENTS.md and skill bodies only, never between two .ai/ files), and a restatement (two or more facts, or one with no owner named, allowed nowhere). Two tests decide which one you wrote"
        - "New: standards/writing-rules.md §4b, a topic-to-file ownership map. §4 answers what a file owns; §4b answers the question a writer actually has, which is where the fact in front of them goes. It covers environments and the branch-to-variable-group mapping, environment variables, the pipeline, container image details, rollback, monitoring wiring and sampling ratios, toolchain version floors, framework version constraints, the command cheatsheet, commit conventions and the accessibility target, and it settles five pairs that looked like shared ownership and were not. It also states the role of AGENTS.md and of skill bodies relative to the map: neither is a second home for a .ai/ fact"
        - "Ownership moves, which a migrated repository has to apply: .ai/onboarding.md owns the command cheatsheet in one table, and .ai/coding-standards.md keeps what each gate enforces without re-listing the commands. Splitting that list by audience is what let three copies drift. .ai/dependencies.md owns toolchain version floors and framework version constraints. .ai/operational-context.md owns the branch-to-variable-group mapping, container image details and every environment variable table, the CMS ones included. .ai/runbooks.md owns rollback as steps and operational-context.md no longer restates it. .ai/cms.md owns the cache layers a published change passes"
        - "The generation prompts apply the map while they write, which is the change that stops the duplication being produced in the first place. Phase 2 lost the instruction that put rollback in operational-context.md, gained per-file single-home statements, a nine-row table of duplications a previous migration shipped and where each one belongs instead, an explicit write-the-owner-first-then-the-pointers order, and a validate.sh gate before the phase can be called complete. Phase 3 fixes the AGENTS.md constraint shape and caps its setup block. Phase 4 bars a skill body from carrying the cheatsheet, the version floors or the deploy and image facts. The Discovery Agent carries the same corrections"
        - "New: scripts/validate.sh Single-Source Integrity, alongside Reference Integrity. It fails on a `## ` heading claimed by two .ai/ files, which is two owners for one topic, allowlisting the standard-mandated `## Validation Questions` that every file carries; and it warns on a command line repeated across files, a skill directory counting as one place. Both signals were verified against a migrated repository: a normalised three-line duplicate-block scan over all 24 of its markdown files found zero hits, so the duplication is paraphrased rather than copy-pasted and a text-similarity detector would have caught almost none of it"
        - "New skill: templates/skills/context-ownership/, installed by Phase 1 before Phase 2 writes anything, and applied by the Maintainer Agent on every documentation edit. It is the per-section procedure for the rule: name the fact, look up its owner, write it there or write a pointer, run the validator. It deliberately holds no copy of the ownership map, because a second copy of an ownership map is the defect the map exists to prevent"
    - version: "2.3.0"
      date: "2026-08-24"
      changes:
        - ".claude/skills is one relative symlink to .agents/skills, not a copy per skill. A copied mirror drifts (13 duplicated skill files in one client repository) and has to be re-copied on every source edit; a symlink cannot. Every path is unchanged, so no skill moves and scripts/validate.sh, which counts with find -L, reports the symlinked mirror in sync"
        - ".claude/agents/<role>.md is a relative symlink to .github/agents/<role>.agent.md, one file per agent instead of two. In one client repository the Claude copy had decayed into a 22-line wrapper telling the reader to go and read the 106-line .github/ file, which is what a second hand-maintained copy turns into"
        - "Agent definitions carry no tools: line. It is optional in both Copilot and Claude Code and omitting it means the agent has every available tool, MCP servers included, so the enumerated list restricted nothing and went stale as a project added servers. A Copilot-format list would be actively wrong on the Claude side, where tools expects Claude tool names. Removing it leaves description and name only, valid for both harnesses, which is what lets the agent mirror be a symlink"
        - "Breaking: an agent is named by its role alone on both sides, .github/agents/<role>.agent.md and .claude/agents/<role>.md, so support-agent.agent.md became support.agent.md. The name: value stays the display form (Discovery Agent, Maintainer Agent, Support Agent): the filename carries the machine-facing role and name: is what a human reads in both pickers. Claude Code documents lowercase letters and hyphens, but a name with spaces and capitals registers and loads, verified in a client repository and on a fresh fixture. scripts/mirror-claude.sh migrates a project on the old names: it renames the legacy source and removes the stale mirror, because two files carrying the same name: register as two agents under one name, the duplicate that appeared in a client repository"
        - ".github/agents/ stays the source for agents rather than moving under .agents/ alongside skills. It is the only repository-level location the GitHub cloud Copilot coding agent reads, and the VS Code chat.agentFilesLocations setting only adds locations as a machine or workspace setting, so a move would need per-developer settings and still force a third copy"
        - "New: scripts/mirror-claude.sh, installed into target repositories. It creates and repairs both Claude Code mirrors, is idempotent, and runs from scripts/install.sh on install and on every --update refresh, so a refresh converts a project still carrying copies"
        - "The conversion never deletes silently: a skill found only in a copied .claude/skills/ directory is moved into .agents/skills/ and reported, and a .claude/agents/<role>.md copy is replaced by the symlink only when its body already matches the source. When the two have drifted the script changes nothing and says so, because only a human can decide which text is right. A .claude/agents/*.md with no source is reported and left in place. On a checkout that cannot create symlinks the script falls back to copying and says so"
        - "scripts/validate.sh resolves the paths named in .ai/ files, the wiring files and the skills, and fails on one that does not exist. Run against the standards repository itself, which has no .ai/, it runs that check alone over that repository's own layout. Only paths under directories the standard owns are resolved: project source layout, package names, bare filenames and URLs are left alone, and the phase prompts, the agent definitions and per-IDE MCP config are out of scope in a target repository because they name files a later phase creates and paths that exist only in the standards repository"
        - "scripts/install.sh bootstraps the /ms-migration command for Cursor as well as Claude Code. Both the installer and the migrate prompt already told a Cursor user to run /ms-migration from .cursor/commands/ms-migration.md, but only the Claude mirror was ever written, so the command did not exist until Phase 1 created it. Bootstrap-only, like its Claude counterpart"
        - "Nothing under .claude/ is authored any more. The phase prompts, the Discovery Agent and the Maintainer Agent write to the source and run the script instead of writing a second copy, and Phase 5 of the migrate prompt states the one case where remove-symmetrically now means removing from the source alone: skills"
    - version: "2.2.0"
      date: "2026-08-24"
      changes:
        - "scripts/install.sh classifies each installed artifact as durable or bootstrap-only. The migrate prompt, the ms-migration command, the discovery agent, the phase prompts 01-04 and scripts/graphify-bootstrap.sh are bootstrap-only: they are never installed or refreshed in a project that has a .ai/.meta.yml, and --update never creates one that is absent, so a version refresh no longer undoes the migrate prompt's Phase 5 cleanup. The installer summary names every skipped artifact and its reason, and deletes nothing"
        - "The migration entry point is one-time: a migrated project removes the migrate prompt and its ms-migration command mirrors, and starts a full re-run from the standards repository bootstrap instead"
        - "CLAUDE.md is a real file holding the @AGENTS.md import and never a symlink to AGENTS.md, stated in the standard, the writing rules, the Discovery Agent, the integrate prompt and the CLAUDE.md template. A write aimed at the symlink overwrites AGENTS.md, and a Windows checkout without symlink support turns it into a one-line file holding the path. The .claude/skills/ mirror is unchanged: a copy and a symlink both stay acceptable there"
    - version: "2.1.0"
      date: "2026-08-17"
      changes:
        - "CI check on pull requests fails when standard content changes without a bump of standard.version"
        - "scripts/install.sh always refreshes the vendored config/standard-version.yml and stamps the current version into an existing .ai/.meta.yml"
        - "scripts/validate.sh reports version drift between .ai/.meta.yml and the vendored config/standard-version.yml, as a per-project consistency check"
        - "scripts/version-report.sh reports which projects run an outdated standard version, comparing each project's .ai/.meta.yml against this repository's current version"
    - version: "2.0.0"
      date: "2026-08-14"
      changes:
        - "Breaking: skills move from .github/skills/ to .agents/skills/, mirrored to .claude/skills/. Every harness in use reads .agents/skills; Codex reads only that path"
        - "Breaking: .github/copilot-instructions.md and .github/instructions/ai-context.instructions.md are no longer generated. AGENTS.md is the one authored wiring file and Copilot reads it as agent instructions"
        - "Breaking: CLAUDE.md is an import of AGENTS.md rather than a copy of its rules"
        - "New: standards/writing-rules.md, the single home for the .ai/ writing rules, installed into target repositories and referenced from every agent, prompt and template"
        - "codebase-overview skill carries structural content generated from .ai/architecture.md instead of a routing table"
        - "Ownership header in all nine .ai/ templates: one topic, one owning file"
    - version: "1.0.0"
      date: "2026-06-17"
      changes:
        - "Initial standard: 9 required .ai/ context files"
        - "Discovery Agent v1 and Maintainer Agent v1"
        - "Stack detection for JS/TS ecosystems"
        - "MCP registry with 15 verified servers"
        - "Templates for Copilot, Claude, and Cursor wiring"
